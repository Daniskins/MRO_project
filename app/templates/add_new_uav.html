<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Добавить новый БПЛА — MRO Dashboard</title>
  <link rel="stylesheet" href="/static/css/add_new_uav.css"/>
</head>
<body>
  <div class="container">
    <h1>Добавить новый БПЛА</h1>
    <form id="addUavForm">
      <div class="form-row">
        <div class="form-group">
          <label for="serialNumber">Серийный номер БПЛА <span style="color:red">*</span></label>
          <input type="text" id="serialNumber" name="serialNumber" placeholder="Например: 90090007007" required />
        </div>
        <div class="form-group">
          <label for="uavModel">Модель БПЛА <span style="color:red">*</span></label>
          <select id="uavModel" name="uavModel" required>
            <option value="">Выберите модель</option>
            <option value="Орлан-10">Орлан-10</option>
            <option value="ZALA 421-16E">ZALA 421-16E</option>
            <option value="Суперкам S350">Суперкам S350</option>
            <!-- другие модели -->
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="tailNumber">Бортовой номер</label>
          <input type="text" id="tailNumber" name="tailNumber" placeholder="Например: КН-07, 902, 77" />
        </div>
        <div class="form-group">
          <label for="operator">Эксплуатант (принадлежность) <span style="color:red">*</span></label>
          <input type="text" id="operator" name="operator" placeholder="Например: в/ч 77984, г/п 012" required />
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="initialHours">Наработка (часы) при вводе в систему</label>
          <input type="number" id="initialHours" name="initialHours" min="0" placeholder="0" />
        </div>
        <div class="form-group">
          <label for="baseLocation">Место базирования / пункт управления <span style="color:red">*</span></label>
          <input type="text" id="baseLocation" name="baseLocation" placeholder="Например: Дземги, Ахтубинск" required />
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="manufactureDate">Дата выпуска</label>
          <input type="date" id="manufactureDate" name="manufactureDate" />
        </div>
        <div class="form-group">
          <label for="status">Статус</label>
          <select id="status" name="status">
            <option value="active">В эксплуатации</option>
            <option value="in_maintenance">На обслуживании</option>
            <option value="decommissioned">Списан</option>
          </select>
        </div>
      </div>
      <div class="btn-group">
        <button type="button" class="btn btn-secondary" onclick="window.history.back()">Отмена</button>
        <button type="submit" class="btn btn-primary">Сохранить БПЛА</button>
      </div>
    </form>
  </div>

  <script src="/static/js/add_new_uav.js"></script>
</body>
</html>
